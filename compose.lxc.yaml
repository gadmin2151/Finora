services:
  db:
    network_mode: host
    command: [postgres, -c, listen_addresses=127.0.0.1]
  api:
    network_mode: host
    ports: !reset []
    command: [uvicorn, app.main:app, --host, "${BIND_ADDRESS:-127.0.0.1}", --port, "${APP_PORT:-8088}"]
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD}@127.0.0.1:5432/finance
      FINORA_HTTP_PORT: ${APP_PORT:-8088}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8088}/api/health', timeout=3)"]
  worker:
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD}@127.0.0.1:5432/finance
  init:
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD}@127.0.0.1:5432/finance
